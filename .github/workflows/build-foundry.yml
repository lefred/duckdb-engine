name: Build and package DuckDB engine plugin

on:
  push:
    branches:
      - foundry
    tags:
      - "v*"

  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    uses: lefred/mariadb-plugin-ci/.github/workflows/build-plugin-new.yml@v1
    with:
      # Autobake build IDs: 11.4.14, 118.10, 12.3.4, 13.1.2, 13.2.0
      mariadb_versions: |
        77519
        77521
        77522
        77100
        77144
      package_formats: tgz            
      # test_suites: duckdb
      parallel: "4"
      almalinux_version: "10"
      allow_partial_release: true
